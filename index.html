<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#111111"><title>가족 재회</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:-apple-system,"Noto Sans KR",sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
h1{font-size:20px;margin:16px 0 4px}.sub{color:#999;font-size:13px}
.card{background:#1c1c1c;border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;border:0;border-radius:12px;padding:14px;background:#333;color:#fff;width:100%;margin-top:8px}
button.war{background:#c0392b;font-size:20px;font-weight:700;padding:22px}
button.sm{width:auto;padding:8px 12px;font-size:13px;margin:6px 6px 0 0}
input{font:inherit;width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#222;color:#fff;margin-top:8px}
.big{font-size:28px;font-weight:700}.stage{color:#ffb74d}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#arrow{width:90px;height:90px;margin:8px auto;display:block;transition:transform .2s}
.slot.next{border:2px solid #c0392b}.slot{border:1px solid #333;border-radius:12px;padding:10px;margin-top:8px}
.warn{color:#ff8a80;font-size:13px}.muted{color:#999;font-size:13px}
@media print{body{background:#fff;color:#000}button,#login,.noprint{display:none!important}.card{background:#fff;border:1px solid #000}}
</style></head><body>
<div id="app"></div>
<script src="data.js"></script><script src="app.js"></script>
</body></html>
